
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nørholm Lydguide - Vildmarken</title>
    
    <!-- Status bar styling for mobil -->
    <meta name="theme-color" content="#022c22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Sort baggrund som fallback for status baren */
        background-color: #022c22;
      }

      /* Outdooractive-inspireret kortbase */
      .leaflet-container {
        height: 100%;
        width: 100%;
        z-index: 1;
        background-color: #f4f7f2 !important;
      }
      .custom-div-icon {
        background: none;
        border: none;
      }
      /* Dette filter rammer præcis det cremede/støvede look fra Outdooractive */
      .leaflet-tile-pane {
        filter: sepia(0.1) hue-rotate(30deg) saturate(0.8) brightness(1.0) contrast(0.95);
      }
      .leaflet-tile {
        image-rendering: -webkit-optimize-contrast;
      }
      
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes pulse-blue {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
      }
      .user-location-puck {
        animation: pulse-blue 2s infinite;
      }

      /* Animation til header baggrund */
      @keyframes header-pan {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-header-pan {
        display: flex;
        width: 200%;
        height: 100%;
        animation: header-pan 120s linear infinite;
        will-change: transform;
      }

      @keyframes splash-pan {
        0% { transform: translateX(0); }
        100% { transform: translateX(-18%); }
      }
      .splash-bg-pan {
        width: 125%;
        max-width: none;
        height: 100%;
        object-fit: cover;
        animation: splash-pan 28s ease-in-out infinite alternate;
        will-change: transform;
      }

      @keyframes tagline-in {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-card-in {
        0% { opacity: 0; transform: translateY(20px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      .tagline-word {
        display: block;
        animation: tagline-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .tagline-keyword {
        animation: tagline-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash-screen {
        font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
      }
      .splash-card {
        animation: splash-card-in 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        background: linear-gradient(165deg, rgba(8, 28, 22, 0.62) 0%, rgba(6, 22, 18, 0.48) 100%);
        border: 1px solid rgba(167, 243, 208, 0.14);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      .splash-rule {
        height: 1px;
        width: 3.5rem;
        background: linear-gradient(90deg, transparent, rgba(167, 243, 208, 0.55), transparent);
      }
      .splash-cta {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        border: 1px solid rgba(167, 243, 208, 0.25);
        box-shadow:
          0 18px 40px rgba(5, 150, 105, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .splash-cta:active {
        transform: scale(0.98);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-bg-pan {
          animation: none;
          width: 100%;
        }
        .tagline-word,
        .tagline-keyword {
          animation: none;
        }
      }

      /* Custom cluster styling */
      .custom-cluster-icon {
        background: none;
        border: none;
      }
    </style>
</head>
<body class="bg-[#022c22]">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
